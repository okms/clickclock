[package]
name = "consultant-timer"
version = "0.1.0"
description = "Consultant Timer desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "consultant_timer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
user-idle = "0.5"

[[bin]]
name = "consultant-timer"
path = "src/main.rs"
